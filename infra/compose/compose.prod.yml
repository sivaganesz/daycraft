# DayCraft production stack: Caddy → API → PostgreSQL.
# The same file runs on the Oracle VM (Phase 5) and locally for testing (README).
#
#   docker compose -f infra/compose/compose.prod.yml --env-file infra/compose/.env.prod up -d --wait
#
# Security model (ARCHITECTURE.md §10, SECURITY.md §2.8):
#   - Only Caddy publishes ports (80/443). The API and database are reachable only inside Docker.
#   - The database sits on an `internal` network: no host access, no internet access.
#   - Containers drop privileges they don't need.
name: daycraft

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m # rotate logs so they can't fill the disk
    max-file: '3'

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      API_HOST: ${API_HOST:?API_HOST is required}
      APEX_HOST: ${APEX_HOST:?APEX_HOST is required}
      APP_URL: ${APP_URL:?APP_URL is required}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep this volume, or Caddy must re-request them
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE] # bind ports 80/443
    security_opt: ['no-new-privileges:true']
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]
    logging: *default-logging

  api:
    image: ${API_IMAGE:-daycraft-api:local}
    restart: unless-stopped
    init: true # forwards stop signals properly, so shutdowns are clean
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      NODE_ENV: production
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://daycraft:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/daycraft
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
    healthcheck:
      # Readiness: healthy only when the API can reach the database.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/v1/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge, data]
    logging: *default-logging

  # One-off job: applies database migrations. Runs only when asked for:
  #   docker compose ... --profile migrate run --rm migrate
  migrate:
    image: ${MIGRATE_IMAGE:-daycraft-api-migrate:local}
    profiles: [migrate]
    environment:
      DATABASE_URL: postgresql://daycraft:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/daycraft
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    logging: *default-logging

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: daycraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: daycraft
    volumes:
      - pgdata:/var/lib/postgresql
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U daycraft -d daycraft']
      interval: 5s
      timeout: 3s
      retries: 10
    # No `ports:` on purpose. The database is never published (Docker bypasses host firewalls).
    networks: [data]
    logging: *default-logging

networks:
  edge: {} # Caddy ↔ API, with internet access
  data:
    internal: true # API ↔ PostgreSQL only; no host or internet access

volumes:
  pgdata:
  caddy_data:
  caddy_config:
